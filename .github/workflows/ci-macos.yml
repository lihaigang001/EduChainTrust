name: CI (macOS)
on: [push, pull_request]
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  test-macos:
    strategy:
      matrix:
        os: [macos-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install -e ".[all]"
      - run: python -m pytest -q -W error::ResourceWarning --cov=educhaintrust --cov=api --cov-fail-under=85
      - run: python examples/university_demo.py
      - run: python experiments/compare_verification.py
      - run: python benchmark/run_benchmarks.py --n 10 --repeats 2 --out ci-benchmark.json
