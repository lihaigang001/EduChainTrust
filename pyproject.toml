[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="educhaintrust"
version="1.12.0"
description="Research framework for verifiable educational records and learning evidence"
readme="README.md"
requires-python=">=3.11"
license="MIT"
license-files=["LICENSE"]
authors=[
    {name = "Haonan Zhang", email = "2025933211@qqhru.edu.cn"},
    {name = "Haigang Li", email = "lihaigang02292@qqhru.edu.cn"},
]
dependencies=["cryptography>=42,<47"]
[project.optional-dependencies]
api=["fastapi>=0.118,<0.120","uvicorn>=0.27,<1","pydantic>=2,<3"]
plot=["matplotlib>=3.8,<4","Pillow>=10,<13"]
dashboard=["streamlit>=1.30,<2"]
test=["pytest>=8,<9","pytest-cov>=5,<8","httpx>=0.27,<0.29"]
all=["fastapi>=0.118,<0.120","uvicorn>=0.27,<1","pydantic>=2,<3","streamlit>=1.30,<2","pytest>=8,<9","pytest-cov>=5,<8","httpx>=0.27,<0.29"]
[tool.setuptools.packages.find]
include=["educhaintrust*","api*"]
